<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valenfore - Game Dev Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            line-height: 1.6;
        }
        header {
            width: 100%;
            height: 350px;
            background-image: url('banner2.jpg');
            background-size: contain;
            background-position: center center;
            background-repeat: no-repeat;
            background-color: #121212;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
        }
        header::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: 1;
        }
        .header-content {
            position: relative;
            z-index: 2;
            padding: 0 20px;
        }
        header h1 {
            font-size: 2.5rem;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            margin-bottom: 10px;
        }
        header p {
            font-size: 1.2rem;
            color: #00d2ff;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }
        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }
        h2 {
            color: #ffffff;
            margin-bottom: 15px;
        }
        p {
            margin-bottom: 20px;
            color: #b0b0b0;
        }
        .donation-box {
            margin-top: 20px;
            margin-bottom: 30px;
            padding: 25px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
        }
        .paypal-btn {
            display: inline-block;
            background-color: #0070ba;
            color: #ffffff;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.2s ease;
            margin-top: 10px;
        }
        .paypal-btn:hover {
            background-color: #003087;
        }
        @media (max-width: 768px) {
            header {
                height: 250px;
            }
            header h1 {
                font-size: 1.8rem;
            }
            header p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <h1></h1>
            <p></p>
        </div>
    </header>

    <main>
        <div class="donation-box">
            <h2>Support My Work</h2>
            <p></p>
            <a href="https://www.paypal.com/donate?business=ernest.o.cooper@gmail.com&item_name=Valenfore+Development+Support&currency_code=USD" target="_blank" class="paypal-btn">
                ☕ Contribute via PayPal
            </a>
        </div>
        <p></p>
        <h2>About Me</h2>
        <p>Alabama Alumni, 17 years developing products.</p>
        <p>This project will be a single player video game, story heavy, written in Godot Game Engine. It will also provide VTT matchmaking services.</p>
    </main>

</body>
</html>
