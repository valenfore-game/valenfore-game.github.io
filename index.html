<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valenfore - Game Dev Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            line-height: 1.6;
        }
        /* Responsive Banner Header */
        header {
            width: 100%;
            height: 400px; /* Adjust height as desired for desktop */
            background-image: url('banner2.jpg'); /* Make sure your image is named banner.jpg */
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
        }
        /* Optional dark overlay to make text pop if needed */
        header::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.3);
            z-index: 1;
        }
        .header-content {
            position: relative;
            z-index: 2;
            padding: 0 20px;
        }
        header h1 {
            font-size: 2.5rem;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            margin-bottom: 10px;
        }
        header p {
            font-size: 1.2rem;
            color: #00d2ff;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }
        /* Main Container */
        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }
        h2 {
            color: #ffffff;
            margin-bottom: 15px;
        }
        p {
            margin-bottom: 20px;
            color: #b0b0b0;
        }
        /* Mobile adjustments */
        @media (max-width: 768px) {
            header {
                height: 300px; /* Shorter height on mobile devices */
            }
            header h1 {
                font-size: 1.8rem;
            }
            header p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Responsive Banner Section -->
    <header>
        <div class="header-content">
            <h1>Valenfore Game Dev</h1>
            <p>Welcome to My Godot Game Dev World</p>
        </div>
    </header>

    <!-- Page Content -->
    <main>
        <h2>About Me</h2>
        <p>I am building awesome games using the Godot Engine. Stay tuned for updates, devlogs, and playable web demos right here on my GitHub Pages site!</p>
    </main>

</body>
</html>
